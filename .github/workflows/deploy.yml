name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Let GitHub Pages serialise deployments internally rather than cancelling
  # in-progress runs. Cancelling mid-upload-pages-artifact leaves no valid
  # artifact for deploy-pages, causing the deployment to fail; the queue
  # approach guarantees every push eventually goes live without a 404 window.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - run: npm ci
      - run: npm run build

      # Hidden sourcemaps make production stack traces debuggable without
      # exposing source through the published GitHub Pages artifact.
      - name: Upload production sourcemaps
        uses: actions/upload-artifact@v7
        with:
          name: production-sourcemaps
          path: dist/**/*.map
          if-no-files-found: error
          retention-days: 14

      - name: Remove sourcemaps from Pages artifact
        run: find dist -name '*.map' -delete

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
