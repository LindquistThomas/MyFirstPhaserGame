name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  # Group by PR number on pull_request events so superseded runs on the same
  # PR are cancelled when a new push arrives; merge_group runs are grouped by
  # head SHA; push events on main fall back to a unique-per-commit key so
  # main builds never cancel one another.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('ci-mq-{0}', github.event.merge_group.head_sha) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect non-docs changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6

      # Detect whether this push/PR touches anything outside docs/**.
      # If only docs/** changed, downstream jobs are skipped — skipped jobs
      # satisfy required status checks, so doc-only PRs can still merge.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!docs/**'
              - '!.github/workflows/**'

  lint-and-unit:
    name: Lint + typecheck + unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  size-budget:
    name: Bundle size budget
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size budgets
        run: npm run size

  e2e:
    name: Playwright E2E (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Keep the other shard running if one fails so the full failure picture
      # is available in a single CI run.
      fail-fast: false
      matrix:
        # Four matrix shards × 2 Playwright workers each keeps every shard
        # under the 5-minute E2E budget while staying under the per-runner
        # 4-vCPU ceiling that triggered timeouts at higher in-runner
        # parallelism.
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build (ensures production bundle typechecks)
        run: npm run build

      - name: Run Playwright tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: npx playwright test --shard ${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # Stable fan-in job: branch protection on main should require THIS name, not
  # individual shard names. Keep required checks aligned to:
  # - Lint + typecheck + unit tests
  # - Playwright E2E complete
  # - Bundle size budget (optional)
  # Remove stale per-shard branch-protection entries if they exist:
  # - Playwright E2E (shard 1/2), Playwright E2E (shard 2/2)
  # - Playwright E2E (shard 1/4) … (shard 4/4)
  # CI cannot inspect branch-protection config; repo admin must verify these
  # required-check names in Settings → Branches → main.
  # Adding/removing shards must not invalidate required checks.
  e2e-complete:
    name: Playwright E2E complete
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed (or skipped for doc-only PRs)
        run: |
          changes="${{ needs.changes.result }}"
          e2e="${{ needs.e2e.result }}"
          # changes must have succeeded for any downstream result to be trusted.
          if [ "$changes" != "success" ]; then
            echo "changes job did not succeed (result: $changes) — failing"
            exit 1
          fi
          # e2e is skipped only when changes decided no code was touched (doc-only PR).
          # In that case the skip is intentional and the gate should pass.
          if [ "$e2e" = "success" ] || [ "$e2e" = "skipped" ]; then
            echo "E2E result: $e2e — OK"
          else
            echo "E2E shards failed or were cancelled (result: $e2e)"
            exit 1
          fi
