<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>So You Want to Be an Architect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
      /* Prevent the page from scrolling/zooming when players swipe the
         on-screen controls. The Phaser canvas and the virtual-pad buttons
         each set touch-action individually. */
      touch-action: none;
    }
    :root {
      --vpad-btn-visual: 52px;
      --vpad-btn-action-visual: 60px;
      --vpad-btn-hit-padding: 0px;
      --vpad-dpad-gap: 4px;
      --vpad-actions-gap: 8px;
      --vpad-actions-padding-bottom: 4px;
      --vpad-touch-hint-offset: 170px;
      --vpad-touch-hint-min-clearance: 186px;
    }
    @media (min-width: 500px) and (max-width: 699px) {
      :root {
        --vpad-btn-visual: 60px;
        --vpad-btn-action-visual: 64px;
        --vpad-btn-hit-padding: 2px;
        --vpad-touch-hint-offset: 206px;
        --vpad-touch-hint-min-clearance: 222px;
      }
    }
    @media (max-width: 499px) {
      :root {
        --vpad-btn-visual: 56px;
        --vpad-btn-action-visual: 60px;
        --vpad-btn-hit-padding: 4px;
        --vpad-actions-padding-bottom: 0px;
        --vpad-touch-hint-offset: 216px;
        --vpad-touch-hint-min-clearance: 232px;
      }
    }
    /*
     * Pillarbox backdrop: the Phaser canvas is fixed 4:3 and FIT-scaled,
     * so wider viewports show empty bars on either side. This canvas sits
     * behind #game-container and receives a blurred, scaled-up copy of
     * the live game canvas each frame (see src/ui/pillarboxBackdrop.ts),
     * so the scene's colours bleed into the bars instead of ending in a
     * hard rectangle.
     */
    #pillarbox-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      filter: blur(48px) brightness(0.6) saturate(1.1);
      transform: scale(1.08);
      transform-origin: center;
      pointer-events: none;
      /* Hidden until the backdrop module starts drawing, to avoid a flash
         of blank canvas during Phaser boot. */
      opacity: 0;
      transition: opacity 300ms ease-in;
    }
    #pillarbox-bg.ready {
      opacity: 1;
    }
    #game-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }
    canvas {
      /* Smooth scaling keeps text crisp when the 1280x960 canvas is
         FIT-scaled to the viewport. Large (128px) pixel-art tiles still
         look fine under bilinear filtering. */
      image-rendering: auto;
    }
    /* Visible keyboard focus ring on the game canvas for screen-reader users. */
    canvas:focus-visible {
      outline: 3px solid #00d4ff;
      outline-offset: 2px;
    }
    /* Screen-reader-only utility: visually hidden but accessible to AT. */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ------------------------------------------------------------------ */
    /* Virtual gamepad — rendered by src/ui/VirtualGamepad.ts on touch     */
    /* devices. Hidden by default; JS makes it visible when isTouchPrimary */
    /* returns true.                                                        */
    /* ------------------------------------------------------------------ */
    #virtual-pad {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      /* Pad sits above the game canvas but clicks pass through the
         transparent wrapper to reach the canvas underneath. */
      z-index: 10;
      pointer-events: none;
      /* Respect notch / home-indicator safe areas. */
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
      padding-left: max(env(safe-area-inset-left, 0px), 12px);
      padding-right: max(env(safe-area-inset-right, 0px), 12px);

      /* Hidden by default; VirtualGamepad.initVirtualGamepad() adds .active */
      display: none;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-end;
      gap: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    #virtual-pad.active {
      display: flex;
    }

    /* Left cluster (D-pad) and right cluster (action buttons) */
    .vpad-cluster {
      pointer-events: none;
    }

    /* D-pad laid out as a cross */
    .vpad-dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--vpad-dpad-gap);
    }
    .vpad-dpad-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--vpad-dpad-gap);
    }
    .vpad-dpad-center {
      width: calc(var(--vpad-btn-visual) + (var(--vpad-btn-hit-padding) * 2));
      height: calc(var(--vpad-btn-visual) + (var(--vpad-btn-hit-padding) * 2));
    }

    /* Action buttons stacked vertically */
    .vpad-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: var(--vpad-actions-gap);
      padding-bottom: var(--vpad-actions-padding-bottom);
    }

    /* Shared button style */
    .vpad-btn {
      --vpad-btn-current-visual: var(--vpad-btn-visual);
      position: relative;
      display: inline-grid;
      place-items: center;
      width: calc(var(--vpad-btn-current-visual) + (var(--vpad-btn-hit-padding) * 2));
      height: calc(var(--vpad-btn-current-visual) + (var(--vpad-btn-hit-padding) * 2));
      padding: var(--vpad-btn-hit-padding);
      color: rgba(255, 255, 255, 0.9);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      border: 0;
      background: transparent;
      box-shadow: none;
      /* Ensure tap/hold state visually responds */
      -webkit-appearance: none;
      appearance: none;
    }
    .vpad-btn::before {
      content: '';
      position: absolute;
      inset: var(--vpad-btn-hit-padding);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.32);
      border: 2px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      transition: background 80ms ease, border-color 80ms ease;
      pointer-events: none;
    }
    .vpad-btn:active::before,
    .vpad-btn.pressed::before {
      background: rgba(255, 255, 255, 0.55);
      border-color: rgba(255, 255, 255, 0.85);
    }
    .vpad-btn:focus-visible {
      outline: 3px solid var(--accent, #ffd166);
      outline-offset: 2px;
    }

    /* High-contrast controls — toggled via Settings → "High Contrast Controls" */
    #virtual-pad.vpad-high-contrast .vpad-btn::before,
    html[data-high-contrast="true"] .vpad-btn::before {
      background: rgba(255, 255, 255, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }
    #virtual-pad.vpad-high-contrast .vpad-btn:active::before,
    #virtual-pad.vpad-high-contrast .vpad-btn.pressed::before,
    html[data-high-contrast="true"] .vpad-btn:active::before,
    html[data-high-contrast="true"] .vpad-btn.pressed::before {
      background: rgba(255, 255, 255, 0.78);
    }
    /* Touch-hint message text is also boosted in high-contrast mode. */
    html[data-high-contrast="true"] #touch-hint-message {
      background: rgba(0, 0, 0, 0.88);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.7);
    }

    /* Action buttons (A/B) are slightly larger */
    .vpad-btn--action {
      --vpad-btn-current-visual: var(--vpad-btn-action-visual);
      font-size: 18px;
      font-weight: bold;
    }

    /* ------------------------------------------------------------------ */
    /* Virtual-gamepad first-run hint overlay                               */
    /* Rendered by src/ui/TouchHintOverlay.ts on the very first touch      */
    /* session. Dismissed on any button press or after 6 s.                */
    /* ------------------------------------------------------------------ */
    #touch-hint-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 11; /* above #virtual-pad (z-index: 10) */
      pointer-events: none;
      display: flex;
      justify-content: center;
      /* Vertically: sit above the virtual-pad cluster.
         Tokens track the current vpad size tier so the hint stays above
         the larger mobile buttons and safe-area inset. */
      padding-bottom: max(
        calc(env(safe-area-inset-bottom, 0px) + var(--vpad-touch-hint-offset)),
        var(--vpad-touch-hint-min-clearance)
      );
      animation: touch-hint-fadein 400ms ease-out forwards;
    }
    #touch-hint-overlay.touch-hint-fadeout {
      animation: touch-hint-fadeout 500ms ease-in forwards;
    }
    @keyframes touch-hint-fadein {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    @keyframes touch-hint-fadeout {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    #touch-hint-message {
      background: rgba(0, 0, 0, 0.72);
      color: rgba(255, 255, 255, 0.92);
      font-family: monospace;
      font-size: 14px;
      line-height: 1.4;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      text-align: center;
      max-width: 280px;
    }

    /* Pulse animation applied to .vpad-dpad and the Jump button */
    @keyframes vpad-pulse {
      0%,  100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);    border-color: rgba(255, 255, 255, 0.35); }
      50%        { box-shadow: 0 0 12px 4px rgba(0, 212, 255, 0.6); border-color: rgba(0, 212, 255, 0.9);  }
    }
    .vpad-hint-pulse {
      animation: vpad-pulse 1.2s ease-in-out infinite;
    }
    .vpad-btn.vpad-hint-pulse::before {
      animation: vpad-pulse 1.2s ease-in-out infinite;
    }
    /* D-pad container needs a border to show the pulse ring */
    .vpad-dpad.vpad-hint-pulse {
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      padding: 4px;
    }
    /* Guest-mode storage-unavailable banner: shown in MenuScene when localStorage
       is blocked (Safari private mode, embedded webviews, etc.). Rendered as a DOM
       element so it is keyboard-focusable and announced by assistive technologies. */
    #guest-mode-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: rgba(160, 60, 0, 0.94);
      color: #ffffff;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      /* Respect notch / status-bar safe area so the text is not obscured on
         iPhones and iPads with a Dynamic Island or Home-indicator notch —
         exactly the Safari-private-mode devices this banner targets. */
      padding: max(env(safe-area-inset-top, 0px), 8px) 20px 8px;
      border-bottom: 2px solid rgba(255, 130, 0, 0.7);
      pointer-events: auto;
      cursor: default;
    }
    #guest-mode-banner:focus-visible {
      outline: 3px solid #ffd166;
      outline-offset: -3px;
    }

  </style>
</head>
<body>
  <canvas id="pillarbox-bg" aria-hidden="true" role="presentation"></canvas>
  <div
    id="game-container"
    role="application"
    aria-label="So You Want To Be An Architect — platformer game"
  ></div>
  <!-- Off-screen live region: game events are announced to assistive technologies. -->
  <div id="game-aria-live" aria-live="polite" aria-atomic="true" class="sr-only"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
